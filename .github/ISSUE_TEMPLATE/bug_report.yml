name: Bug report
description: Report a reproducible issue in Parch Linux components.
title: "[Bug]: "
labels: ["bug"]
assignees:
  - metantesan
  - behdanisohrab
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. Please provide enough detail to reproduce it.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include what you expected to happen and what happened instead.
      placeholder: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide exact steps in order.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Parch Linux version
      description: Output of `cat /etc/os-release` or release identifier.
      placeholder: e.g. Parch Linux rolling (2026.05)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Desktop environment or window manager
        - Core applications
        - Installer or setup
        - Packaging and updates
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste relevant logs, command output, or traces.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I agree to follow this project's Code of Conduct.
          required: true
